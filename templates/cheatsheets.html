{{define "mountPoint"}}
<article class="collection-page collection-page--cheatsheets editorial-page" id="cheatsheets-top">
  <header class="collection-hero editorial-hero">
    <p class="collection-kicker editorial-kicker">Reference archive</p>
    <h1 class="editorial-title">Cheatsheets</h1>
    <p class="collection-intro editorial-intro">Short, practical references for commands and workflows.</p>
  </header>

  <section class="collection-section" aria-labelledby="cheatsheets-heading">
    <header class="collection-section-heading editorial-section-heading">
      <p>Reference</p>
      <h2 id="cheatsheets-heading">All cheatsheets</h2>
    </header>
    <div class="collection-list collection-list--compact">
      {{range .Cheatsheets}}
        <a class="collection-card cheatsheet-card" href="/cheatsheets/{{.Slug}}">
          <span class="collection-card-icon" aria-hidden="true"><i class="fas fa-terminal"></i></span>
          <span class="collection-card-copy">
            <strong>{{.Title}}</strong>
            <span>{{.Description}}</span>
          </span>
          <span class="collection-card-arrow" aria-hidden="true">→</span>
        </a>
      {{end}}
    </div>
  </section>

  <footer class="collection-local-footer">
    <a href="#cheatsheets-top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</article>
{{end}}
