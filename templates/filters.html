{{define "mountPoint"}}
  <div class="filtersContainer">
    <h1>Blog posts by year</h1>
    <div class="tagContainer years">
      {{range .Years}}
        {{if gt (getYearCount .) 0}}
        <div><a href="{{yearUrl .}}" class="yearTag">{{.}}</a> x {{getYearCount .}}</div>
        {{end}}
      {{end}}
    </div>
    <h1>Blog posts by tag</h1>
    {{range .TagGroups}}
    <h2>{{.Name}}</h2>
    <div class="tagContainer">
      {{range .Tags}}
      <div><a href="{{tagUrl .}}" class="tag">{{.}}</a> x {{getTagCount .}}</div>
      {{end}}
    </div>
    {{end}}
  </div>
{{end}}
