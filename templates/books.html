{{define "mountPoint"}}
<h1>Books</h1>
<p class="books-intro">The list below contains books that I’ve read and good enough to share.</p>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
  <input type="text" id="search-books" placeholder="Search books..." style="width:100%;max-width:400px;padding:10px 14px;font-size:1em;border-radius:8px;border:1px solid #e2e8f0;outline:none;">
  <span id="book-count" style="color:#94a3b8;font-size:1em;white-space:nowrap;">({{.BookCount}} total)</span>
</div>
<div class="books-grid" id="books-grid" style="display: flex; flex-direction: column; gap: 28px;">
  {{range .Books}}
    <div class="card-entry">
      <div class="project-entry">
        <div class="project-content">
          <h3><a href="{{.GoodreadsURL}}" target="_blank" rel="noopener noreferrer" class="blog-title">{{.Title}}</a></h3>
          <div class="book-author">by {{.Author}}</div>
          <div class="book-meta"><em>{{.Year}}, {{.Publisher}}, {{.Pages}} pages</em></div>
          <div class="project-links">
            <a href="{{.GoodreadsURL}}" target="_blank" rel="noopener noreferrer" title="View on Goodreads" class="action-link website-link"><i class="fas fa-book"></i></a>
            <a href="{{.AudibleURL}}" target="_blank" rel="noopener noreferrer" title="Search on Audible" class="action-link audible-link"><i class="fab fa-audible"></i></a>
          </div>
        </div>
      </div>
    </div>
  {{end}}
</div>
<script>
  // Client-side search for books and update count
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-books');
    const booksGrid = document.getElementById('books-grid');
    const bookCount = document.getElementById('book-count');
    if (!searchInput || !booksGrid || !bookCount) return;
    function updateCount() {
      const entries = booksGrid.getElementsByClassName('card-entry');
      let visible = 0;
      for (const entry of entries) {
        if (entry.style.display !== 'none') visible++;
      }
      bookCount.textContent = `(${visible} total)`;
    }
    searchInput.addEventListener('input', function() {
      const query = searchInput.value.trim().toLowerCase();
      const entries = booksGrid.getElementsByClassName('card-entry');
      for (const entry of entries) {
        const text = entry.textContent.toLowerCase();
        entry.style.display = text.includes(query) ? '' : 'none';
      }
      updateCount();
    });
    updateCount();
  });
</script>
{{end}}
