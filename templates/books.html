{{define "mountPoint"}}
<article class="collection-page collection-page--books editorial-page" id="books-top">
  <header class="collection-hero editorial-hero">
    <p class="collection-kicker editorial-kicker">Reading archive</p>
    <h1 class="editorial-title">Books</h1>
    <p class="collection-intro editorial-intro">Books I’ve read and thought worth sharing.</p>
  </header>

  <section class="collection-section" aria-labelledby="books-heading">
    <header class="collection-section-heading editorial-section-heading">
      <p>Library</p>
      <h2 id="books-heading">All books</h2>
    </header>

    <div class="collection-search">
      <label for="search-books">Search the archive</label>
      <div class="collection-search-field">
        <i class="fas fa-search" aria-hidden="true"></i>
        <input type="search" id="search-books" placeholder="Title, author, publisher, or year" autocomplete="off">
      </div>
    </div>

    <div class="collection-list" id="books-list">
      {{range .Books}}
        <article class="collection-card book-card" data-book>
          <span class="collection-card-icon" aria-hidden="true"><i class="fas fa-book-open"></i></span>
          <div class="collection-card-copy">
            <h3><a href="{{.GoodreadsURL}}" target="_blank" rel="noopener noreferrer">{{.Title}}</a></h3>
            <p class="book-author">{{.Author}}</p>
            <p class="book-meta"><span>{{.Year}}</span><span>{{.Publisher}}</span><span>{{.Pages}} pages</span></p>
          </div>
          <div class="book-links">
            <a href="{{.GoodreadsURL}}" target="_blank" rel="noopener noreferrer">Goodreads <span aria-hidden="true">↗</span></a>
            <a href="{{.AudibleURL}}" target="_blank" rel="noopener noreferrer">Audible <span aria-hidden="true">↗</span></a>
          </div>
        </article>
      {{end}}
    </div>
    <p class="collection-empty" id="books-empty" hidden>No books match that search.</p>
  </section>

  <footer class="collection-local-footer">
    <a href="#books-top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</article>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-books');
    const books = Array.from(document.querySelectorAll('[data-book]'));
    const emptyState = document.getElementById('books-empty');
    if (!searchInput || !books.length || !emptyState) return;

    function applyBookSearch() {
      const query = searchInput.value.trim().toLowerCase();
      let visible = 0;
      books.forEach(function(book) {
        const isVisible = !query || book.textContent.toLowerCase().includes(query);
        book.hidden = !isVisible;
        if (isVisible) visible += 1;
      });
      emptyState.hidden = visible !== 0;
    }

    searchInput.addEventListener('input', applyBookSearch);
    searchInput.addEventListener('search', applyBookSearch);
  });
</script>
{{end}}
