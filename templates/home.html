{{define "mountPoint"}}
  <div class="previewContainer">
    {{range .Posts}}
      <article class="blogPostPreview">
        <h1><a href="{{.PostUrl}}" class="blogPostPreviewLink">{{.BlogPost.Title}}</a></h1>
        <div class="post-meta">
          <span class="datePosted">Posted on {{.PostDate}}</span>
          <span class="reading-time">{{.ReadingTime}} min read</span>
        </div>
        <div class="preview">
          {{if .BlogPost.ImagePath}}
            <a href="{{.PostUrl}}">
              <img src="/{{.BlogPost.ImagePath}}" 
                   class="previewImage" 
                   alt="Preview image for {{.BlogPost.Title}}"
                   loading="lazy"
                   decoding="async">
            </a>
          {{end}}
          {{.Preview}}
        </div>
        <div class="readMore">
          <a href="{{.PostUrl}}"><span>Read more...</span></a>
        </div>
      </article>
    {{end}}
  </div>

  <div class="viewAllPosts">
    <a href="/all" class="viewAllLink">View All Blog Posts →</a>
  </div>
{{end}}
