{{define "mountPoint"}}
<article class="collection-page collection-page--advice editorial-page" id="advice-top">
  <header class="collection-hero editorial-hero">
    <h1 class="editorial-title">{{t "Advice"}}</h1>
    <p class="collection-kicker editorial-kicker">{{t "Collected notes"}}</p>
    <p class="collection-intro editorial-intro">{{t "Personal principles and lessons I’ve collected over the years."}}</p>
  </header>

  <section class="collection-section" aria-labelledby="advice-heading">
    <header class="collection-section-heading editorial-section-heading">
      <h2 id="advice-heading">{{t "Principles and lessons"}}</h2>
      <p>{{t "Notes"}}</p>
    </header>
    <div class="advice-list">{{htmlSafe .Content}}</div>
  </section>

  <footer class="collection-local-footer">
    <a href="#advice-top">{{t "Back to top"}} <span aria-hidden="true">↑</span></a>
  </footer>
</article>
{{end}}
